# /etc/loglens/helper.toml: what loglens-helper may stream, and to whom.
# Must be owned by root and not writable by group/others, or the helper refuses to start.
# Only what is listed here is ever served, read-only.

# systemd units (their journal)
units = ["ssh.service", "squid.service", "clamav-daemon.service", "nginx.service"]

# Log files (absolute glob patterns; symlinks are never followed)
files = [
  "/var/log/squid/*.log",
  "/var/log/clamav/*.log",
  "/var/log/nginx/*.log",
  "/var/log/auth.log",
]

# Members of these groups are allowed without a password prompt. The package creates
# the "loglens" group: sudo usermod -aG loglens USER (then log out and back in).
allow_groups = ["loglens"]

# Everyone else: ask polkit (an administrator password, remembered for a while).
polkit = true

max_clients = 16
