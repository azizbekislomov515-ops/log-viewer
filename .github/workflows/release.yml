name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  UV_VERSION: "0.12.5"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot >/dev/null
      - name: Version matches the tag
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: .deb
        run: packaging/deb/build-deb.sh
      - name: QA the .deb on a fresh Ubuntu 24.04
        run: docker run --rm -v "$PWD/dist:/dist" -v "$PWD/packaging/qa:/qa:ro" ubuntu:24.04 bash /qa/qa-deb.sh
      - name: AppImage
        run: packaging/appimage/build-appimage.sh
      - name: Wheel and source
        run: uv build --out-dir dist
      - name: Checksums
        run: cd dist && sha256sum loglens_*.deb LogLens-*.AppImage loglens-*.whl loglens-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: loglens-${{ github.ref_name }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "LogLens $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES_0.1.0.md \
            dist/*.deb dist/*.AppImage dist/*.whl dist/*.tar.gz dist/SHA256SUMS
