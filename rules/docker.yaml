# Docker: container lifecycle (from `docker events` output), dockerd/containerd daemon logs,
# image pulls, networks and volumes.
#
# `docker events` lines look like
#   2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=137, image=nginx, name=web-1)
# Attributes are sorted, so the regexes find exitCode/name with look-aheads.
# dockerd lines go through the dockerd parser: fields event, container_id, error, signal...
pack: docker
version: 1
description: Docker containers and the Docker daemon.
example_source: systemd:docker.service
applies_to:
  parsers: [dockerd]
  programs: [dockerd, containerd]
  units: [docker.service, containerd.service, docker.socket]
  paths: [/var/log/docker.log, /var/log/containerd.log, "*docker-events*"]

overview:
  # Container lifecycle events appear in each container's own stream.
  applies_to: {services: ["*"], units: [docker.service, containerd.service]}
  cards:
    - {title: Exit codes, kind: top, field: code, when: {tags: [exit]}, empty: No container exited.}
    - {title: Restart history, kind: recent, when: {tags: [restart]}, limit: 8,
       empty: No restarts in this period.}
    - {title: Crashes and kills, kind: recent, when: {tags: [oom, restart_loop, health]}, limit: 5,
       warn_at: 1, empty: Nothing was killed.}
    - {title: "Image, network and volume problems", kind: recent, when: {tags: [image, network, volume]},
       limit: 5, empty: None.}

rules:
  # ---------------------------------------------------------------- container exits
  - id: docker.container.exit_0
    title: "{{ name }} finished (exit 0)"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      regex: ^container die \S+ (?=.*[(,] ?exitCode=(?P<code>0)[,)])(?=.*[(,] ?name=(?P<name>[^,)]+))
    template: Container {{ name }} stopped normally (exit code 0); its main program finished its work.
    action: Nothing to do for one-off jobs. If {{ name | shquote }} is a long-running service, check why its program exited (docker logs {{ name | shquote }}).
    category: availability
    tags: [exit]
    severity_override: info
    examples:
      - line: "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=0, image=alpine, name=backup-job)"
        expect:
          title: backup-job finished (exit 0)
          text: Container backup-job stopped normally (exit code 0); its main program finished its work.
    counter_examples:
      - "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=1, image=alpine, name=backup-job)"

  - id: docker.container.exit_1
    title: "{{ name }} failed (exit 1)"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      regex: ^container die \S+ (?=.*[(,] ?exitCode=(?P<code>1)[,)])(?=.*[(,] ?name=(?P<name>[^,)]+))
    template: Container {{ name }} stopped because its program reported an error (exit code 1).
    cause: An application error, such as bad configuration, a missing file or a failed connection to a database.
    action: Read the last lines the program printed with "docker logs --tail 50 {{ name | shquote }}".
    category: availability
    tags: [exit]
    severity_override: error
    examples:
      - line: "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=1, image=myapp:2.3, name=api-1)"
        expect:
          text: Container api-1 stopped because its program reported an error (exit code 1).
    counter_examples:
      - "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=137, image=myapp:2.3, name=api-1)"

  - id: docker.container.exit_125
    title: "{{ name }} could not be started (exit 125)"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      regex: ^container die \S+ (?=.*[(,] ?exitCode=(?P<code>125)[,)])(?=.*[(,] ?name=(?P<name>[^,)]+))
    template: Docker itself failed to run container {{ name }} (exit code 125); the program inside never started.
    cause: An invalid "docker run" option, a bad mount or port setting, or a daemon-side error.
    action: Re-run the container's command by hand and read Docker's error message; check the daemon log (journalctl -u docker).
    category: configuration
    tags: [exit]
    severity_override: error
    examples:
      - line: "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=125, image=myapp, name=api-1)"
        expect:
          text: >-
            Docker itself failed to run container api-1 (exit code 125); the program inside never
            started.
    counter_examples:
      - "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=126, image=myapp, name=api-1)"

  - id: docker.container.exit_126
    title: "{{ name }}: command not executable (exit 126)"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      regex: ^container die \S+ (?=.*[(,] ?exitCode=(?P<code>126)[,)])(?=.*[(,] ?name=(?P<name>[^,)]+))
    template: Container {{ name }} stopped because its start command exists but could not be run (exit code 126).
    cause: The entrypoint script is not executable (missing chmod +x), or it is a directory or a file for another CPU type.
    action: Check the image's ENTRYPOINT/CMD and run "chmod +x" on the script in the Dockerfile.
    category: configuration
    tags: [exit]
    severity_override: error
    examples:
      - line: "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=126, image=myapp, name=api-1)"
        expect:
          text: >-
            Container api-1 stopped because its start command exists but could not be run (exit
            code 126).
    counter_examples:
      - "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=127, image=myapp, name=api-1)"

  - id: docker.container.exit_127
    title: "{{ name }}: command not found (exit 127)"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      regex: ^container die \S+ (?=.*[(,] ?exitCode=(?P<code>127)[,)])(?=.*[(,] ?name=(?P<name>[^,)]+))
    template: Container {{ name }} stopped because its start command (or a program it calls) does not exist in the image (exit code 127).
    cause: A typo in the command, or a tool the image does not include.
    action: Check the command in the compose file or "docker run" line, and that the image contains it ("docker run --rm -it --entrypoint sh <image>").
    category: configuration
    tags: [exit]
    severity_override: error
    examples:
      - line: "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=127, image=myapp, name=api-1)"
        expect:
          text: >-
            Container api-1 stopped because its start command (or a program it calls) does not
            exist in the image (exit code 127).
    counter_examples:
      - "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=126, image=myapp, name=api-1)"

  - id: docker.container.exit_137
    title: "{{ name }} was killed (exit 137)"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      regex: ^container die \S+ (?=.*[(,] ?exitCode=(?P<code>137)[,)])(?=.*[(,] ?name=(?P<name>[^,)]+))
    template: Container {{ name }} was forcibly killed (exit code 137, SIGKILL).
    cause: >-
      It ran out of memory (look for an "oom" event just before), or it was stopped and did not
      shut down within the grace period, or someone ran "docker kill".
    action: >-
      Run "docker inspect -f '{{ '{{' }}.State.OOMKilled{{ '}}' }}' {{ name | shquote }}". If true, raise its memory
      limit or fix the memory use; otherwise check who stopped it.
    category: availability
    tags: [exit]
    severity_override: error
    confidence: 0.8
    examples:
      - line: "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=137, image=nginx:1.27, name=web-1)"
        expect:
          title: web-1 was killed (exit 137)
          text: Container web-1 was forcibly killed (exit code 137, SIGKILL).
          action: >-
            Run "docker inspect -f '{{.State.OOMKilled}}' web-1". If true, raise its memory limit or
            fix the memory use; otherwise check who stopped it.
    counter_examples:
      - "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=143, image=nginx:1.27, name=web-1)"

  - id: docker.container.exit_139
    title: "{{ name }} crashed (exit 139)"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      regex: ^container die \S+ (?=.*[(,] ?exitCode=(?P<code>139)[,)])(?=.*[(,] ?name=(?P<name>[^,)]+))
    template: Container {{ name }} crashed with a segmentation fault (exit code 139); the program accessed memory it should not.
    cause: A bug in the program or a native library, or an image built for a different CPU or C library.
    action: Check "docker logs {{ name | shquote }}" and the kernel log (segfault lines); try the image's latest version.
    category: availability
    tags: [exit]
    severity_override: error
    examples:
      - line: "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=139, image=legacy:1, name=worker-2)"
        expect:
          text: >-
            Container worker-2 crashed with a segmentation fault (exit code 139); the program
            accessed memory it should not.
    counter_examples:
      - "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=137, image=legacy:1, name=worker-2)"

  - id: docker.container.exit_143
    title: "{{ name }} stopped on request (exit 143)"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      regex: ^container die \S+ (?=.*[(,] ?exitCode=(?P<code>143)[,)])(?=.*[(,] ?name=(?P<name>[^,)]+))
    template: Container {{ name }} shut down after being asked to stop (SIGTERM, exit code 143).
    cause: A "docker stop", a compose down/restart, an update, or the host shutting down.
    category: availability
    tags: [exit]
    severity_override: notice
    examples:
      - line: "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=143, image=nginx:1.27, name=web-1)"
        expect:
          text: Container web-1 shut down after being asked to stop (SIGTERM, exit code 143).
    counter_examples:
      - "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=0, image=nginx:1.27, name=web-1)"

  - id: docker.container.exit_other
    title: "{{ name }} exited ({{ code }})"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      regex: ^container die \S+ (?=.*[(,] ?exitCode=(?P<code>\d+)[,)])(?=.*[(,] ?name=(?P<name>[^,)]+))
    template: >-
      Container {{ name }} stopped with exit code {{ code }}{% if code | int > 128 %}, which means
      it was ended by signal {{ code | int - 128 }}{% endif %}.
    action: The program decides what its exit codes mean; check "docker logs --tail 50 {{ name | shquote }}".
    category: availability
    tags: [exit]
    severity_override: warning
    confidence: 0.7
    examples:
      - line: "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=2, image=myapp, name=api-1)"
        expect:
          text: Container api-1 stopped with exit code 2.
      - line: "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=134, image=myapp, name=api-1)"
        expect:
          text: Container api-1 stopped with exit code 134, which means it was ended by signal 6.
    counter_examples:
      - "2026-11-18T20:10:00.123456789+05:00 container start 4f1e2d3c4b5a (image=myapp, name=api-1)"

  - id: docker.container.oom_event
    title: "{{ name }} ran out of memory"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      regex: ^container oom \S+ (?=.*[(,] ?name=(?P<name>[^,)]+))
    template: Container {{ name }} hit its memory limit and the kernel killed a process inside it.
    action: Raise its memory limit (mem_limit / --memory) or find what uses the memory ("docker stats {{ name | shquote }}").
    category: performance
    tags: [oom]
    severity_override: error
    examples:
      - line: "2026-11-18T20:12:00.000000000+05:00 container oom 1122334455aa (image=java-app:3, name=reports-1)"
        expect:
          text: Container reports-1 hit its memory limit and the kernel killed a process inside it.
    counter_examples:
      - "2026-11-18T20:10:00.123456789+05:00 container die 4f1e2d3c4b5a (exitCode=137, image=nginx:1.27, name=web-1)"

  - id: docker.container.started
    title: "{{ name }} started"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      regex: ^container start \S+ (?=.*[(,] ?name=(?P<name>[^,)]+))
    template: Container {{ name }} started.
    category: availability
    severity_override: info
    tags: [restart]
    examples:
      - line: "2026-11-18T20:18:00.000000000+05:00 container start deadbeef0001 (image=nginx:1.27, name=web-1)"
        expect:
          text: Container web-1 started.
    counter_examples:
      - "2026-11-18T20:18:00.000000000+05:00 container create deadbeef0001 (image=nginx:1.27, name=web-1)"

  - id: docker.container.unhealthy
    title: "{{ name }} is unhealthy"
    applies_to:
      services: ["*"]
      units: [docker.service, containerd.service]
      parsers: [dockerd]
    match:
      field: raw  # the syslog parser mistakes "container health_status:" for host + program
      regex: "\\bcontainer health_status: unhealthy \\S+ (?=.*[(,] ?name=(?P<name>[^,)]+))"
    template: Container {{ name }} is running but failed its health check several times in a row.
    cause: The service inside is stuck, overloaded, or still starting; or the health check command itself is wrong.
    action: "See the last check results: docker inspect --format '{{ '{{' }}json .State.Health{{ '}}' }}' {{ name | shquote }}"
    category: availability
    tags: [health]
    severity_override: error
    examples:
      - line: "2026-11-18T20:13:00.000000000+05:00 container health_status: unhealthy 2b3c4d5e6f70 (image=api:1, name=api-1)"
        expect:
          text: Container api-1 is running but failed its health check several times in a row.
    counter_examples:
      - "2026-11-18T20:13:00.000000000+05:00 container health_status: healthy 2b3c4d5e6f70 (image=api:1, name=api-1)"

  # ---------------------------------------------------------------- daemon view of containers
  - id: docker.daemon.container_oom
    title: "Container {{ container_id[:12] }} ran out of memory"
    match:
      fields: {event: container_oom}
    extract: [container_id]
    template: Container {{ container_id[:12] }} hit its memory limit and the kernel killed a process inside it.
    action: Find the container with "docker ps -a --filter id={{ container_id[:12] | shquote }}" and raise its memory limit or reduce its memory use.
    category: performance
    tags: [oom]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:12:00.000000000+05:00" level=info msg="ignoring event" container=1122334455aa module=libcontainerd namespace=moby topic=/tasks/oom type="*events.TaskOOM"'
        expect:
          text: Container 1122334455aa hit its memory limit and the kernel killed a process inside it.
    counter_examples:
      - 'time="2026-11-18T20:11:10.000000000+05:00" level=info msg="ignoring event" container=9a8b7c6d5e4f module=libcontainerd namespace=moby topic=/tasks/exit type="*events.TaskExit"'

  - id: docker.daemon.kill_forced
    title: "Container {{ container_id[:12] }} force-killed"
    match:
      fields: {event: container_kill_forced}
    extract: [container_id, timeout_s]
    template: >-
      Container {{ container_id[:12] }} did not stop within {{ timeout_s }} s of being asked, so
      Docker killed it.
    cause: The program ignores SIGTERM or needs longer to shut down; it may lose unsaved work.
    action: Make the program handle SIGTERM, or give it more time (stop_grace_period / docker stop -t).
    category: availability
    tags: [oom]
    severity_override: warning
    examples:
      - line: 'time="2026-11-18T20:11:00.000000000+05:00" level=info msg="Container failed to exit within 10s of signal 15 - using the force" container=9a8b7c6d5e4f'
        expect:
          text: Container 9a8b7c6d5e4f did not stop within 10 s of being asked, so Docker killed it.
    counter_examples:
      - 'time="2026-11-18T20:16:00.000000000+05:00" level=info msg="Processing signal ''terminated''"'

  - id: docker.daemon.healthcheck_cmd_missing
    title: "Health check command missing: {{ cmd }}"
    match:
      fields: {event: healthcheck_error}
      field: error
      regex: 'exec: "(?P<cmd>[^"]+)": executable file not found'
    extract: [container_id]
    template: The health check of container {{ container_id[:12] }} runs "{{ cmd }}", but the image does not contain that program, so every check fails.
    action: Install {{ cmd | shquote }} in the image, or change the HEALTHCHECK to a command the image has (e.g. wget, or a script).
    category: configuration
    tags: [health]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:13:00.000000000+05:00" level=warning msg="Health check for container 2b3c4d5e6f70 error: OCI runtime exec failed: exec failed: unable to start container process: exec: \"curl\": executable file not found in $PATH: unknown"'
        expect:
          text: >-
            The health check of container 2b3c4d5e6f70 runs "curl", but the image does not contain
            that program, so every check fails.
    counter_examples:
      - 'time="2026-11-18T20:13:00.000000000+05:00" level=warning msg="Health check for container 2b3c4d5e6f70 error: context deadline exceeded"'

  - id: docker.daemon.healthcheck_error
    title: "Health check could not run: {{ container_id[:12] }}"
    match:
      fields: {event: healthcheck_error}
    extract: [container_id, error]
    template: "Docker could not run the health check of container {{ container_id[:12] }}: {{ error }}."
    cause: The check took longer than its timeout, or the container is too busy or broken to execute it.
    action: Check the container ("docker logs {{ container_id[:12] | shquote }}") and the HEALTHCHECK timeout.
    category: availability
    tags: [health]
    severity_override: warning
    examples:
      - line: 'time="2026-11-18T20:13:00.000000000+05:00" level=warning msg="Health check for container 2b3c4d5e6f70 error: context deadline exceeded"'
        expect:
          text: "Docker could not run the health check of container 2b3c4d5e6f70: context deadline exceeded."
    counter_examples:
      - 'time="2026-11-18T20:12:00.000000000+05:00" level=info msg="ignoring event" container=1122334455aa module=libcontainerd namespace=moby topic=/tasks/oom type="*events.TaskOOM"'

  - id: docker.container.restart_loop
    title: "Container {{ id }} keeps restarting"
    match:
      regex: Container (?P<id>\S+) is restarting, wait until the container is running
    template: Container {{ id }} is stuck in a restart loop; it crashes right after starting and Docker keeps restarting it.
    action: Read why it crashes ("docker logs --tail 50 {{ id | shquote }}"); stop the loop with "docker update --restart=no {{ id | shquote }}" while you fix it.
    category: availability
    tags: [restart_loop]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Error response from daemon: Container 4f1e2d3c4b5a is restarting, wait until the container is running"'
        expect:
          text: >-
            Container 4f1e2d3c4b5a is stuck in a restart loop; it crashes right after starting and
            Docker keeps restarting it.
    counter_examples:
      - "2026-11-18T20:18:00.000000000+05:00 container start deadbeef0001 (image=nginx:1.27, name=web-1)"

  - id: docker.container.exec_format_error
    title: Image built for another CPU type
    applies_to:
      parsers: [dockerd]
      units: [docker.service, containerd.service]
      services: ["*"]
    match:
      regex: exec (?P<cmd>\S+?):? exec format error
    template: The program {{ cmd }} in this image was built for a different CPU type (for example ARM vs x86), so it cannot run here.
    action: Pull or build the image for this machine's platform (docker pull --platform linux/amd64 ..., or a multi-arch image).
    category: configuration
    severity_override: error
    examples:
      - line: "exec /usr/local/bin/docker-entrypoint.sh: exec format error"
        source: docker:api-1
        expect:
          text: >-
            The program /usr/local/bin/docker-entrypoint.sh in this image was built for a different
            CPU type (for example ARM vs x86), so it cannot run here.
    counter_examples:
      - line: "exec /usr/local/bin/docker-entrypoint.sh: permission denied"
        source: docker:api-1

  # ---------------------------------------------------------------- images
  - id: docker.image.pull_denied
    title: "Cannot pull {{ image }}"
    match:
      regex: pull access denied for (?P<image>[^,\s]+)
    template: Docker could not download the image {{ image }}; the registry says it does not exist or needs a login.
    action: Check the image name for typos; for a private image run "docker login <registry>" first.
    category: configuration
    tags: [image]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Not continuing with pull after error: pull access denied for myorg/private-api, repository does not exist or may require ''docker login''"'
        expect:
          text: >-
            Docker could not download the image myorg/private-api; the registry says it does not
            exist or needs a login.
    counter_examples:
      - 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="manifest for nginx:1.99 not found: manifest unknown: manifest unknown"'

  - id: docker.image.tag_not_found
    title: "No such image version: {{ image }}"
    match:
      regex: manifest for (?P<image>\S+) not found
    template: The registry has the image, but not the version {{ image }}.
    action: Check the tag in your compose file or command against the tags published for that image.
    category: configuration
    tags: [image]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="manifest for nginx:1.99 not found: manifest unknown: manifest unknown"'
        expect:
          text: The registry has the image, but not the version nginx:1.99.
    counter_examples:
      - 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Not continuing with pull after error: pull access denied for myorg/private-api, repository does not exist or may require ''docker login''"'

  - id: docker.image.rate_limited
    title: Docker Hub pull limit reached
    match:
      regex: toomanyrequests|reached your (?:unauthenticated )?pull rate limit
    template: Docker Hub refused the download because this machine (or its public IP) pulled too many images recently.
    action: Log in with "docker login" (higher limit), wait a few hours, or use a registry mirror/cache.
    category: availability
    tags: [image]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Error response from daemon: toomanyrequests: You have reached your unauthenticated pull rate limit. https://www.docker.com/increase-rate-limit"'
        expect:
          text: >-
            Docker Hub refused the download because this machine (or its public IP) pulled too many
            images recently.
    counter_examples:
      - 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="manifest for nginx:1.99 not found: manifest unknown: manifest unknown"'

  - id: docker.image.registry_unreachable
    title: "Registry unreachable: {{ host }}"
    match:
      regex: 'Get "https://(?P<host>[^/"]+)/v2/[^"]*": (?P<reason>(?:dial tcp|net/http)[^"]*?(?:no such host|i/o timeout|TLS handshake timeout|connection refused|request canceled[^"]*))'
    template: Docker could not reach the image registry {{ host }} ({{ reason }}).
    cause: No internet or DNS on this host, a firewall, or Docker not using the required HTTP proxy.
    action: Test "curl -I https://{{ host | shquote }}/v2/". If you need a proxy, configure it for the Docker daemon (systemd drop-in with HTTPS_PROXY).
    category: availability
    tags: [image]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Error response from daemon: Get \"https://registry-1.docker.io/v2/\": dial tcp: lookup registry-1.docker.io on 127.0.0.53:53: no such host"'
        expect:
          text: >-
            Docker could not reach the image registry registry-1.docker.io (dial tcp: lookup
            registry-1.docker.io on 127.0.0.53:53: no such host).
    counter_examples:
      - 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="manifest for nginx:1.99 not found: manifest unknown: manifest unknown"'

  # ---------------------------------------------------------------- networks and volumes
  - id: docker.network.port_in_use
    title: "Port already in use: {{ port }}"
    match:
      regex: Bind for (?P<address>\S+?):(?P<port>\d+) failed:? port is already allocated
    template: A container could not start because port {{ port }} on {{ address }} is already used by another container.
    action: Find the other one with "docker ps --filter publish={{ port | shquote }}", then stop it or map this container to a different host port.
    category: configuration
    tags: [network]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:13:30.000000000+05:00" level=error msg="Handler for POST /v1.47/containers/abc/start returned error: driver failed programming external connectivity on endpoint web-1: Bind for 0.0.0.0:80 failed: port is already allocated"'
        expect:
          text: A container could not start because port 80 on 0.0.0.0 is already used by another container.
    counter_examples:
      - 'time="2026-11-18T20:13:30.000000000+05:00" level=error msg="listen tcp4 0.0.0.0:80: bind: address already in use"'

  - id: docker.network.address_in_use
    title: "Port taken by a host program: {{ port }}"
    match:
      regex: 'listen tcp\d? (?P<address>\S+?):(?P<port>\d+): bind:? address already in use'
    template: A container could not publish port {{ port }} because a program outside Docker already listens on it.
    action: "Find it with: sudo ss -ltnp | grep :{{ port | shquote }} then stop it or choose another host port."
    category: configuration
    tags: [network]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:13:30.000000000+05:00" level=error msg="Handler for POST /v1.47/containers/abc/start returned error: driver failed programming external connectivity on endpoint web-1: Error starting userland proxy: listen tcp4 0.0.0.0:80: bind: address already in use"'
        expect:
          text: A container could not publish port 80 because a program outside Docker already listens on it.
    counter_examples:
      - 'time="2026-11-18T20:13:30.000000000+05:00" level=error msg="Handler for POST /v1.47/containers/abc/start returned error: driver failed programming external connectivity on endpoint web-1: Bind for 0.0.0.0:80 failed: port is already allocated"'

  - id: docker.network.not_found
    title: "Network missing: {{ network }}"
    match:
      regex: network (?P<network>\S+) not found
    template: A container refers to the Docker network {{ network }}, which does not exist (any more).
    action: Create it ("docker network create {{ network | shquote }}") or recreate the containers so they use the current network.
    category: configuration
    tags: [network]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Handler for POST /v1.47/containers/abc/start returned error: network shop_backend not found"'
        expect:
          text: A container refers to the Docker network shop_backend, which does not exist (any more).
    counter_examples:
      - 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="failed to create network shop_default: Error response from daemon: Pool overlaps with other one on this address space"'

  - id: docker.network.pool_overlap
    title: Network address range conflict
    match:
      regex: Pool overlaps with other one on this address space
    template: Docker could not create a network because its IP range overlaps one that already exists (another Docker network or a VPN).
    action: Remove unused networks ("docker network prune") or set a different subnet / default-address-pools in daemon.json.
    category: configuration
    tags: [network]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="failed to create network shop_default: Error response from daemon: Pool overlaps with other one on this address space"'
        expect:
          text: >-
            Docker could not create a network because its IP range overlaps one that already exists
            (another Docker network or a VPN).
    counter_examples:
      - 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Handler for POST /v1.47/containers/abc/start returned error: network shop_backend not found"'

  - id: docker.volume.bind_source_missing
    title: "Missing folder for bind mount: {{ path }}"
    match:
      regex: bind source path does not exist:\s*(?P<path>\S+)
    template: A container could not start because the host folder {{ path }} it should mount does not exist.
    action: Create {{ path | shquote }} on the host (or fix the path in the compose file / -v option).
    category: configuration
    tags: [volume]
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Handler for POST /v1.47/containers/create returned error: invalid mount config for type \"bind\": bind source path does not exist: /srv/data/uploads"'
        expect:
          text: A container could not start because the host folder /srv/data/uploads it should mount does not exist.
    counter_examples:
      - 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Error response from daemon: remove pgdata: volume is in use - [4f1e2d3c4b5a]"'

  - id: docker.volume.in_use
    title: "Volume in use: {{ volume }}"
    match:
      regex: 'remove (?P<volume>\S+): volume is in use'
    template: The volume {{ volume }} cannot be deleted because a container (running or stopped) still uses it.
    action: Remove that container first ("docker ps -a --filter volume={{ volume | shquote }}"), then the volume.
    category: configuration
    tags: [volume]
    severity_override: warning
    examples:
      - line: 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Error response from daemon: remove pgdata: volume is in use - [4f1e2d3c4b5a]"'
        expect:
          text: The volume pgdata cannot be deleted because a container (running or stopped) still uses it.
    counter_examples:
      - 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Handler for POST /v1.47/containers/create returned error: invalid mount config for type \"bind\": bind source path does not exist: /srv/data/uploads"'

  - id: docker.volume.mount_failed
    title: "Volume mount failed: {{ volume }}"
    match:
      regex: error while mounting volume '(?P<volume>[^']+)':\s*(?P<reason>.+?)"?$
    template: "Docker could not mount the volume {{ volume }}: {{ reason }}"
    cause: For NFS/CIFS volumes, the file server is unreachable or rejected the mount options.
    action: Check the volume's driver options ("docker volume inspect") and that the remote server is reachable.
    category: availability
    tags: [volume]
    severity_override: error
    examples:
      - line: >-
          time="2026-11-18T20:20:00.000000000+05:00" level=error msg="error while mounting volume '/var/lib/docker/volumes/media/_data': failed to mount local volume: mount :/srv/nfs/media:/var/lib/docker/volumes/media/_data, flags: 0x400: connection refused"
        expect:
          text: >-
            Docker could not mount the volume /var/lib/docker/volumes/media/_data: failed to mount
            local volume: mount :/srv/nfs/media:/var/lib/docker/volumes/media/_data, flags: 0x400:
            connection refused
    counter_examples:
      - 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="Error response from daemon: remove pgdata: volume is in use - [4f1e2d3c4b5a]"'

  - id: docker.daemon.disk_full
    title: Docker disk is full
    match:
      regex: no space left on device
    template: Docker could not write to disk because the disk holding /var/lib/docker is full.
    action: Check with "docker system df", then free space with "docker system prune" (removes unused images, containers and build cache).
    category: availability
    severity_override: error
    examples:
      - line: 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="failed to register layer: write /var/lib/docker/overlay2/abc/diff/usr/lib/libx.so: no space left on device"'
        expect:
          text: Docker could not write to disk because the disk holding /var/lib/docker is full.
    counter_examples:
      - 'time="2026-11-18T20:20:00.000000000+05:00" level=error msg="manifest for nginx:1.99 not found: manifest unknown: manifest unknown"'

  # ---------------------------------------------------------------- daemon lifecycle
  - id: docker.daemon.pid_file
    title: Docker daemon already running (pid file)
    match:
      regex: pid file found, ensure docker is not running or delete (?P<path>\S+)
    template: The Docker daemon refused to start because {{ path }} says another dockerd is already running.
    action: If "pgrep dockerd" finds nothing, the file is stale; delete {{ path | shquote }} and start docker again.
    category: availability
    severity_override: critical
    examples:
      - line: 'time="2026-11-18T20:17:01.000000000+05:00" level=fatal msg="Error starting daemon: pid file found, ensure docker is not running or delete /var/run/docker.pid"'
        expect:
          text: >-
            The Docker daemon refused to start because /var/run/docker.pid says another dockerd is
            already running.
    counter_examples:
      - 'time="2026-11-18T20:17:00.000000000+05:00" level=error msg="failed to start daemon: Error initializing network controller: error obtaining controller instance: failed to register \"bridge\" driver"'

  - id: docker.daemon.start_failed
    title: Docker daemon failed to start
    match:
      fields: {event: daemon_start_failed}
      regex: (?:failed to start daemon|Error starting daemon):\s*(?P<reason>.+)
    template: "The Docker daemon could not start: {{ reason }}. No containers can run until this is fixed."
    action: Run "journalctl -u docker -b" for the full error; network-controller errors often follow firewall (iptables/nftables) changes.
    category: availability
    severity_override: critical
    examples:
      - line: 'time="2026-11-18T20:17:00.000000000+05:00" level=error msg="failed to start daemon: Error initializing network controller: error obtaining controller instance: failed to register \"bridge\" driver"'
        expect:
          text: >-
            The Docker daemon could not start: Error initializing network controller: error obtaining
            controller instance: failed to register "bridge" driver. No containers can run until this
            is fixed.
    counter_examples:
      - 'time="2026-11-18T20:07:04.101010101+05:00" level=info msg="Starting up"'

  - id: docker.daemon.starting
    title: Docker daemon starting
    match:
      fields: {event: daemon_starting}
    template: The Docker daemon is starting; containers with a restart policy will come back up shortly.
    category: availability
    severity_override: notice
    tags: [restart]
    examples:
      - line: 'time="2026-11-18T20:07:04.101010101+05:00" level=info msg="Starting up"'
        expect:
          text: The Docker daemon is starting; containers with a restart policy will come back up shortly.
    counter_examples:
      - 'time="2026-11-18T20:07:06.964398116+05:00" level=info msg="Daemon has completed initialization"'

  - id: docker.daemon.ready
    title: Docker daemon ready
    match:
      fields: {event: daemon_ready}
    template: The Docker daemon finished starting and is accepting commands.
    category: availability
    severity_override: info
    examples:
      - line: 'time="2026-11-18T20:07:06.964398116+05:00" level=info msg="Daemon has completed initialization"'
        expect:
          text: The Docker daemon finished starting and is accepting commands.
    counter_examples:
      - 'time="2026-11-18T20:07:04.101010101+05:00" level=info msg="Starting up"'

  - id: docker.daemon.stopped
    title: Docker daemon stopped
    match:
      fields: {event: daemon_stopped}
    template: The Docker daemon shut down; its containers are stopped until it starts again.
    category: availability
    severity_override: notice
    examples:
      - line: 'time="2026-11-18T20:16:01.000000000+05:00" level=info msg="Daemon shutdown complete"'
        expect:
          text: The Docker daemon shut down; its containers are stopped until it starts again.
    counter_examples:
      - 'time="2026-11-18T20:07:04.101010101+05:00" level=info msg="Starting up"'

  - id: docker.daemon.cgroup_feature_missing
    title: Kernel lacks an optional cgroup feature
    match:
      regex: Your kernel does not support (?P<feature>cgroup [\w ]+)
    template: This kernel does not support {{ feature }}, so that Docker resource limit is ignored. Containers still run normally.
    category: info
    severity_override: info
    examples:
      - line: 'time="2026-11-18T20:15:00.000000000+05:00" level=warning msg="Your kernel does not support cgroup blkio weight"'
        expect:
          text: >-
            This kernel does not support cgroup blkio weight, so that Docker resource limit is
            ignored. Containers still run normally.
    counter_examples:
      - 'time="2026-11-18T20:07:04.101010101+05:00" level=info msg="Starting up"'
