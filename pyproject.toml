[project]
name = "loglens"
version = "0.1.0"
description = "Discover every log source on a Linux machine and explain it in plain language."
readme = "CLAUDE.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "docker>=7.1",
    "PyYAML>=6.0",
]

[project.scripts]
loglens-cli = "loglens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-docker",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loglens"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "RUF", "PTH", "C4", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/loglens"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
