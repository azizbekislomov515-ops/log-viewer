repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit (security lint)
        entry: uv run bandit -q -c pyproject.toml -r src
        language: system
        types: [python]
        pass_filenames: false
